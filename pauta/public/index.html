<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pauta editorial</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  :root {
    --bg: #f6f3ec; --card: #fffdf8; --ink: #1d1b16; --muted: #6d675b; --line: #ddd5c4;
    --accent: #c2410c; --fun: #d97706; --fun-bg: #fef3c7; --serious: #1e40af; --serious-bg: #dbeafe;
    --neutral: #57534e; --neutral-bg: #eeebe5; --shadow: rgba(60, 45, 20, .18); --err: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16140f; --card: #1f1c16; --ink: #f1ece2; --muted: #a39b8b; --line: #3a352b;
      --accent: #fb923c; --fun: #fbbf24; --fun-bg: #3b2a08; --serious: #93c5fd; --serious-bg: #172554;
      --neutral: #d6d3d1; --neutral-bg: #2c2924; --shadow: rgba(0, 0, 0, .55); --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font: 800 30px/1.1 Georgia, "Times New Roman", serif; margin: 0 0 20px; letter-spacing: -0.5px; }
  textarea, input { width: 100%; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; }
  textarea { min-height: 220px; resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: 13px; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  button { min-height: 48px; background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font: 600 16px system-ui, sans-serif; cursor: pointer; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: .6; cursor: wait; }
  .status { color: var(--muted); font-size: 13px; }
  .status.err { color: var(--err); }
  [hidden] { display: none !important; }

  /* Vistas */
  .view-enter { animation: enter .28s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* Historial (vista inicio) */
  #history { margin-top: 28px; }
  #history h2 { font: 700 17px Georgia, serif; margin: 0 0 8px; }
  #historyEmpty { color: var(--muted); font-size: 13px; margin: 0; }
  .h-item { display: flex; align-items: stretch; background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; min-width: 0; }
  .h-open { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; text-align: left; background: transparent; color: var(--ink); padding: 14px 16px; font: 15px/1.4 system-ui, sans-serif; }
  .h-date { font-weight: 600; white-space: nowrap; }
  .h-meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .h-prev { flex-basis: 100%; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .h-prog { flex-basis: 100%; height: 3px; margin-top: 5px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .h-prog > span { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
  .h-prog.full > span { background: var(--muted); }
  .h-del { min-width: 56px; background: transparent; color: var(--muted); padding: 0 16px; font-size: 22px; line-height: 1; border-left: 1px solid var(--line); border-radius: 0 8px 8px 0; }
  .h-del:hover { color: var(--err); }

  /* Etiqueta de tono (lista y animación) */
  .tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; padding: 2px 7px; border-radius: 99px; white-space: nowrap; background: var(--neutral-bg); color: var(--neutral); transition: background-color .4s, color .4s; }
  .gracioso .tag { background: var(--fun-bg); color: var(--fun); }
  .serio .tag { background: var(--serious-bg); color: var(--serious); }

  /* Pantalla "armando" */
  #armando h2 { font: 700 20px Georgia, serif; margin: 0 0 4px; }
  #armando .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .shuffle { position: relative; }
  .shuffle { max-width: 420px; padding: 6px 0; }
  .sc { --tone: var(--neutral); position: relative; height: 8px; border-radius: 4px; margin-bottom: 14px; background: linear-gradient(to right, var(--tone) 0 22px, var(--line) 22px); }
  .sc.gracioso { --tone: var(--fun); }
  .sc.serio { --tone: var(--serious); }
  .sc.lift { z-index: 2; }
  #armandoStatus { margin-top: 10px; }
  @media (prefers-reduced-motion: reduce) {
    .view-enter { animation: none; }
    .shuffle .sc { animation: pulse 2.4s ease-in-out infinite; }
    .shuffle .sc:nth-child(2n) { animation-delay: -1.2s; }
  }
  @keyframes pulse { 50% { opacity: .55; } }

  /* Vista pauta */
  .p-bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; margin: -24px -16px 0; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .back { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px 0 12px; margin-left: -4px; border: 1px solid var(--line); border-radius: 22px; background: var(--card); color: var(--ink); font-weight: 600; text-decoration: none; white-space: nowrap; }
  .back:hover { border-color: var(--accent); }
  .p-bar-title { min-width: 0; font: 700 15px Georgia, serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #viewPauta h2 { font: 700 22px/1.2 Georgia, serif; margin: 20px 0 2px; }
  .p-meta { color: var(--muted); font-size: 13px; margin: 0; }
  .p-crit { margin: 8px 0 0; font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--card); border: 1px dashed var(--line); overflow-wrap: anywhere; }
  .p-crit b { font-weight: 600; color: var(--muted); }
  .rhythm { display: flex; gap: 2px; margin: 14px 0 0; }
  .rhythm span { flex: 1; height: 8px; border-radius: 2px; transition: opacity .3s; }
  .rhythm span.done { opacity: .22; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 14px 0; }
  .toolbar button:disabled { opacity: .45; cursor: default; }
  .p-sub { display: flex; justify-content: flex-end; margin: -6px 0 6px; }
  .linkish { background: transparent; color: var(--muted); padding: 6px 4px; font: 600 15px system-ui, sans-serif; text-decoration: underline; text-underline-offset: 3px; }
  .linkish:hover { color: var(--ink); }
  .p-end { text-align: center; padding: 28px 16px; margin-top: 4px; background: var(--card); border: 1px dashed var(--line); border-radius: 8px; }
  .p-end-t { font: 700 22px Georgia, serif; margin: 0 0 6px; }
  .p-end .status { margin: 0 0 14px; }
  .plist { list-style: none; padding: 0; margin: 0; }
  .plist > li { position: relative; display: grid; grid-template-columns: 36px 30px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 72px; background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--neutral); border-radius: 10px; padding: 14px 16px 14px 14px; margin-bottom: 12px; cursor: pointer; transition: background-color .15s; }
  .plist > li:hover { background: var(--neutral-bg); }
  .plist > li.gracioso { border-left-color: var(--fun); }
  .plist > li.serio { border-left-color: var(--serious); }
  .plist > li.done { opacity: .45; }
  .plist > li.leaving { overflow: hidden; pointer-events: none; }
  .plist .n { font: 700 18px Georgia, serif; color: var(--muted); text-align: right; }
  .plist .t a { color: var(--ink); font-size: 17px; line-height: 1.3; font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
  /* El link cubre toda la fila: tocar en cualquier parte abre la noticia. */
  .plist .t a::after { content: ""; position: absolute; inset: 0; border-radius: 10px; }
  .plist .t a:focus-visible { outline: none; }
  .plist .t a:focus-visible::after { outline: 3px solid var(--accent); outline-offset: 2px; }
  .plist > li:hover .t a { text-decoration: underline; }
  .plist .meta { font-size: 13px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
  /* Reordenar: se arrastra solo desde el ⋮⋮ (el resto de la fila sigue haciendo scroll y abriendo links) */
  .grip { position: relative; z-index: 1; align-self: stretch; display: flex; align-items: center; justify-content: center; width: 48px; min-height: 56px; height: auto; margin: -14px 0 -14px -14px; padding: 0; border-radius: 10px 0 0 10px; background: transparent; color: var(--muted); font: 700 18px system-ui, sans-serif; letter-spacing: -2px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  .grip:hover { color: var(--ink); background: var(--neutral-bg); }
  .grip:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .plist.is-dragging { user-select: none; -webkit-user-select: none; }
  .plist.is-dragging a { pointer-events: none; }
  .plist.is-dragging > li:not(.dragging) { transition: transform .2s cubic-bezier(.2, .75, .25, 1); }
  .plist > li.dragging, .plist > li.settling { position: relative; z-index: 3; box-shadow: 0 10px 28px var(--shadow); }
  .plist > li.dragging .grip { cursor: grabbing; color: var(--ink); }
  body.grabbing, body.grabbing * { cursor: grabbing !important; }
  .p-sub { justify-content: space-between; align-items: center; gap: 10px; }
  .hint { color: var(--muted); font-size: 12px; }
  @media (prefers-reduced-motion: reduce) {
    .plist.is-dragging > li:not(.dragging) { transition: none; }
  }
  @media (max-width: 420px) {
    .plist > li { grid-template-columns: 36px 24px minmax(0, 1fr); gap: 10px; }
    .plist > li .tag { grid-column: 3; justify-self: start; }
  }
</style>
</head>
<body>
<main>
  <!-- Vista inicio: #/ -->
  <section id="viewInicio">
    <h1>📡 Pauta editorial</h1>

    <div id="form">
      <label for="texto">Links de hoy (título + link, en cualquier formato)</label>
      <textarea id="texto" placeholder="Perro se roba un pollo en pleno noticiero&#10;https://www.tiktok.com/@...&#10;&#10;Banco Central sube la tasa de interés https://www.latercera.com/..."></textarea>

      <label for="criterio">Indicación extra (opcional)</label>
      <input id="criterio" maxlength="500" placeholder="Ej: abrir con lo del Congreso; dejar el video del gato para el cierre">

      <div class="row">
        <button id="go">Armar pauta</button>
        <span id="status" class="status" role="status"></span>
      </div>

      <section id="history">
        <h2>Historial</h2>
        <p id="historyEmpty" hidden>Todavía no hay pautas.</p>
        <div id="historyList"></div>
      </section>
    </div>

    <!-- Pantalla mientras Claude ordena -->
    <section id="armando" hidden aria-busy="true">
      <h2>Armando la pauta…</h2>
      <div id="shuffle" class="shuffle" aria-hidden="true"></div>
      <p id="armandoStatus" class="status" role="status"></p>
    </section>
  </section>

  <!-- Vista pauta: #/pauta/<id> -->
  <section id="viewPauta" hidden>
    <div class="p-bar">
      <a class="back" id="back" href="#/">← Volver</a>
      <span class="p-bar-title" id="pBarTitle"></span>
    </div>
    <h2 id="pTitle">Orden sugerido</h2>
    <p class="p-meta" id="pMeta"></p>
    <p class="p-crit" id="pCrit" hidden><b>Indicación:</b> <span></span></p>
    <div class="rhythm" id="rhythm" title="Ritmo de la pauta"></div>
    <div class="toolbar" id="toolbar">
      <button id="openNext">Abrir siguiente ↗</button>
      <button class="ghost" id="copy">Copiar lista</button>
      <button class="ghost" id="reset">Reiniciar</button>
      <span id="pStatus" class="status" role="status"></span>
    </div>
    <div class="p-sub"><span class="hint" id="dragHint" hidden>Arrastra ⋮⋮ para mover</span><span></span><button class="linkish" id="toggleDone" hidden></button></div>
    <ol id="list" class="plist"></ol>
    <div class="p-end" id="pEnd" hidden>
      <p class="p-end-t">¡Pauta terminada! 🎉</p>
      <p class="status">Abriste todos los links.</p>
      <button id="resetEnd">Reiniciar</button>
    </div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const colors = { gracioso: "var(--fun)", serio: "var(--serious)", neutro: "var(--neutral)" };
  const TONOS = ["gracioso", "serio", "neutro"];
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
  let current = null; // pauta abierta: { id, createdAt, updatedAt, criterio, items }
  let items = []; // = current.items (orden actual)
  let view = null; // "inicio" | "pauta"
  let cameFromInicio = false; // para que "Volver" use history.back() y no apile entradas
  let busy = false; // POST /api/ordenar en curso

  try { $("texto").value = localStorage.getItem("pauta:texto") || ""; } catch {}
  $("texto").addEventListener("input", () => { try { localStorage.setItem("pauta:texto", $("texto").value); } catch {} });

  // Escribe en la línea de estado de la vista visible.
  function status(msg, err = false) {
    const el = view === "pauta" ? $("pStatus") : $("status");
    el.textContent = msg;
    el.classList.toggle("err", err);
  }

  async function api(path, opts = {}) {
    let r;
    try {
      r = await fetch(path, opts.body ? { ...opts, headers: { "content-type": "application/json" } } : opts);
    } catch {
      throw new Error("No pude conectar con el servidor.");
    }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(data.error || `Error ${r.status}`), { status: r.status });
    return data;
  }

  // "mar 14 oct, 17:09" en hora local
  function fecha(iso) {
    const d = new Date(iso);
    const p = Object.fromEntries(new Intl.DateTimeFormat("es-CL", { weekday: "short", day: "numeric", month: "short" })
      .formatToParts(d).map((x) => [x.type, x.value.replace(".", "")]));
    const hora = d.toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit", hour12: false });
    return `${p.weekday} ${p.day} ${p.month}, ${hora}`;
  }

  /* ---------- Router (hash) ---------- */

  function parseHash() {
    const m = location.hash.match(/^#\/pauta\/([^/?#]+)$/);
    return m ? { view: "pauta", id: decodeURIComponent(m[1]) } : { view: "inicio" };
  }

  function showView(name) {
    const prev = view;
    view = name;
    $("viewInicio").hidden = name !== "inicio";
    $("viewPauta").hidden = name !== "pauta";
    if (prev === name) return;
    cameFromInicio = prev === "inicio" && name === "pauta";
    const el = name === "pauta" ? $("viewPauta") : $("viewInicio");
    el.classList.remove("view-enter");
    void el.offsetWidth; // reinicia la animación de entrada
    el.classList.add("view-enter");
    window.scrollTo(0, 0);
    document.title = name === "pauta" && current ? `Pauta del ${fecha(current.createdAt)}` : "Pauta editorial";
    if (name === "inicio") loadHistory();
  }

  let routeSeq = 0;
  async function route() {
    const r = parseHash();
    const seq = ++routeSeq;
    if (r.view === "inicio") return showView("inicio");
    if (!current || current.id !== r.id) {
      try {
        const { pauta } = await api(`api/pautas/${encodeURIComponent(r.id)}`);
        if (seq !== routeSeq) return; // el usuario ya navegó a otra parte
        setPauta(pauta);
      } catch (e) {
        if (seq !== routeSeq) return;
        history.replaceState(null, "", "#/");
        showView("inicio");
        status(e.status === 404 || e.status === 400 ? "Esa pauta no existe (¿la borraste?)." : e.message, true);
        return;
      }
    }
    showView("pauta");
  }

  function goPauta(id) { location.hash = `#/pauta/${encodeURIComponent(id)}`; }

  $("back").addEventListener("click", (e) => {
    // Si llegamos desde el inicio, volver atrás en el historial evita apilar entradas.
    if (cameFromInicio) { e.preventDefault(); history.back(); }
  });

  window.addEventListener("hashchange", route);

  /* ---------- Vista pauta ---------- */

  function setPauta(pauta) {
    current = pauta;
    items = pauta ? pauta.items : [];
    if (pauta) renderPauta();
  }

  // ¿Mostrar los links ya vistos (atenuados)? Por defecto se ocultan.
  let showDone = false;
  try { showDone = localStorage.getItem("pauta:mostrarVistos") === "1"; } catch {}

  // Guarda en el servidor los cambios de la pauta (qué links ya se abrieron y/o el orden).
  // Los envíos de una misma pauta van uno tras otro: si hay cambios mientras uno está en vuelo,
  // al terminar se manda el estado local más reciente de todo lo pendiente (`done` y/o `order`
  // en un solo PUT). La respuesta nunca pisa el estado local; lo que falla se reintenta junto
  // con el próximo cambio. `saving` es la promesa que el historial espera antes de recargar.
  let saving = Promise.resolve();
  let saveError = false;
  function queueSave(what) {
    const p = current;
    if (!p) return saving;
    p._dirty = { ...p._retry, ...p._dirty, ...what };
    p._retry = null;
    if (!p._flush) {
      p._flush = (async () => {
        try {
          while (p._dirty) {
            const d = p._dirty;
            p._dirty = null;
            const body = {};
            if (d.order) body.order = p.items.map((it) => it.id);
            if (d.done) body.done = p.items.filter((it) => it.done).map((it) => it.id);
            try {
              await api(`api/pautas/${encodeURIComponent(p.id)}`, { method: "PUT", body: JSON.stringify(body) });
              if (saveError && !p._dirty) {
                saveError = false;
                if (view === "pauta" && current === p) status("Guardado.");
              }
            } catch (e) {
              console.warn("No pude guardar la pauta:", e);
              saveError = true;
              if (p._dirty) p._dirty = { ...d, ...p._dirty }; // ya hay otro cambio: va todo junto
              else p._retry = { ...p._retry, ...d };
              const que = d.order ? (d.done ? "los cambios" : "el nuevo orden") : "los vistos";
              if (view === "pauta" && current === p) status(`No pude guardar ${que} (${e.message.replace(/\.$/, "")}). Se reintenta en el próximo cambio.`, true);
            }
          }
        } finally {
          p._flush = null;
        }
      })();
      saving = p._flush;
    }
    return saving;
  }
  const saveDone = () => queueSave({ done: true });
  const saveOrder = () => queueSave({ order: true });

  const doneCount = () => items.filter((it) => it.done).length;

  function markDone(it) {
    if (it.done) return false;
    it.done = true;
    saveDone();
    renderHeader();
    renderRhythm();
    return true;
  }

  function renderHeader() {
    const n = items.length;
    const d = doneCount();
    const next = items.findIndex((it) => !it.done);
    const vistos = `${d} ${d === 1 ? "visto" : "vistos"}`;
    $("pBarTitle").textContent = fecha(current.createdAt);
    $("pTitle").textContent = `Pauta del ${fecha(current.createdAt)}`;
    $("pMeta").textContent = next === -1 ? `${n} links · todos vistos` : `Vas en la ${next + 1} de ${n} · ${vistos}`;
    $("pCrit").hidden = !current.criterio;
    $("pCrit").querySelector("span").textContent = current.criterio || "";
    $("openNext").disabled = next === -1;
    $("reset").disabled = d === 0;
    $("toggleDone").hidden = d === 0;
    $("toggleDone").textContent = showDone ? "Ocultar vistos" : `Mostrar vistos (${d})`;
    $("pEnd").hidden = !(n > 0 && next === -1);
  }

  // Barra de ritmo: todos los links, los vistos atenuados.
  function renderRhythm() {
    $("rhythm").replaceChildren(...items.map((it) => {
      const bar = document.createElement("span");
      bar.style.background = colors[it.tono] || colors.neutro;
      if (it.done) bar.className = "done";
      return bar;
    }));
  }

  // Dibuja la barra de ritmo y la lista en el orden de `items`. Los vistos se omiten salvo con
  // "Mostrar vistos"; cada link conserva su número en la pauta completa (índice en `items` + 1).
  function renderList() {
    if (drag) endDrag(false);
    renderRhythm();
    $("list").replaceChildren();
    items.forEach((it, i) => {
      if (it.done && !showDone) return;
      const li = document.createElement("li");
      li.className = it.tono + (it.done ? " done" : "");
      li.dataset.id = it.id;
      li.innerHTML = `<button type="button" class="grip" aria-label="Mover">⋮⋮</button><div class="n"></div><div class="t"><a target="_blank" rel="noopener noreferrer"></a><div class="meta"></div></div><span class="tag"></span>`;
      li.querySelector(".n").textContent = i + 1;
      const a = li.querySelector("a");
      a.href = it.url;
      a.textContent = it.title || it.url;
      // No hacer preventDefault: el navegador abre la pestaña y después escondemos el link.
      const opened = () => { if (markDone(it)) hideItem(li); };
      a.addEventListener("click", opened);
      a.addEventListener("auxclick", (e) => { if (e.button === 1) opened(); });
      li.querySelector(".meta").textContent = `${it.domain} · ${it.motivo}`;
      li.querySelector(".tag").textContent = it.tono;
      const grip = li.querySelector(".grip");
      grip.title = "Arrastra para mover (o usa ↑ ↓)";
      grip.addEventListener("pointerdown", (e) => startDrag(e, li));
      grip.addEventListener("keydown", (e) => moveByKey(e, li));
      $("list").appendChild(li);
    });
    renderHint();
  }

  /* ---------- Reordenar: arrastrar el ⋮⋮ (mouse y touch) o flechas con el ⋮⋮ enfocado ---------- */

  let dragHintSeen = false;
  try { dragHintSeen = localStorage.getItem("pauta:arrastreVisto") === "1"; } catch {}
  function renderHint() {
    $("dragHint").hidden = dragHintSeen || $("list").children.length < 2;
  }

  // Números de cada fila = posición en la pauta completa (incluye los vistos ocultos).
  function renumber() {
    const pos = new Map(items.map((it, i) => [String(it.id), i + 1]));
    for (const li of $("list").children) li.querySelector(".n").textContent = pos.get(li.dataset.id);
  }

  // Nuevo orden completo a partir del orden visible del DOM: los ocultos (vistos) se quedan en su
  // casilla de `items` y los visibles ocupan las casillas restantes en su nuevo orden.
  function applyDomOrder() {
    const byId = new Map(items.map((it) => [String(it.id), it]));
    const visible = [...$("list").children].map((li) => byId.get(li.dataset.id)).filter(Boolean);
    const inDom = new Set(visible);
    let k = 0;
    const next = items.map((it) => (inDom.has(it) ? visible[k++] : it));
    if (next.every((it, i) => it === items[i])) return false;
    current.items = items = next;
    saveOrder();
    renumber();
    renderRhythm();
    renderHeader();
    if (!dragHintSeen) {
      dragHintSeen = true;
      try { localStorage.setItem("pauta:arrastreVisto", "1"); } catch {}
      renderHint();
    }
    return true;
  }

  let drag = null;

  function startDrag(e, li) {
    if (drag || (e.pointerType === "mouse" && e.button !== 0)) return;
    const list = $("list");
    if (list.querySelector(".leaving")) {
      // Termina de golpe los links que se estaban plegando y arrastra la fila recién dibujada.
      renderList();
      li = list.querySelector(`li[data-id="${li.dataset.id}"]`);
      if (!li) return;
    }
    const grip = li.querySelector(".grip");
    const rows = [...list.children].map((el) => {
      const r = el.getBoundingClientRect();
      return { el, top: r.top + scrollY, h: r.height };
    });
    const from = rows.findIndex((r) => r.el === li);
    const me = rows[from];
    const last = rows[rows.length - 1];
    drag = {
      li, grip, rows, from, to: from, id: e.pointerId,
      y0: e.clientY, sy0: scrollY, y: e.clientY, sy: scrollY, dy: 0,
      slot: me.h + parseFloat(getComputedStyle(li).marginBottom || 0),
      min: rows[0].top - me.top, max: last.top + last.h - (me.top + me.h),
      raf: 0,
    };
    try { grip.setPointerCapture(e.pointerId); } catch {}
    grip.addEventListener("pointermove", onDragMove);
    grip.addEventListener("pointerup", onDragUp);
    grip.addEventListener("pointercancel", onDragCancel);
    grip.addEventListener("lostpointercapture", onDragCancel);
    document.addEventListener("keydown", onDragKey, true);
    list.classList.add("is-dragging");
    document.body.classList.add("grabbing");
    li.classList.add("dragging");
    li.style.transform = "scale(1.02)";
    drag.raf = requestAnimationFrame(dragFrame);
  }

  function onDragMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    drag.y = e.clientY;
    e.preventDefault();
  }
  function onDragUp(e) { if (drag && e.pointerId === drag.id) endDrag(true); }
  function onDragCancel(e) { if (drag && e.pointerId === drag.id) endDrag(false); }
  function onDragKey(e) {
    if (e.key !== "Escape") return;
    e.preventDefault();
    e.stopPropagation();
    endDrag(false);
  }

  // Un frame del arrastre: auto-scroll cerca de los bordes, mover la fila y abrir el hueco.
  function dragFrame() {
    if (!drag) return;
    const d = drag;
    const topEdge = Math.max(0, document.querySelector(".p-bar").getBoundingClientRect().bottom) + 48;
    const bottomEdge = innerHeight - 48;
    let speed = 0;
    if (d.y < topEdge) speed = -Math.min(18, Math.ceil((topEdge - d.y) / 3));
    else if (d.y > bottomEdge) speed = Math.min(18, Math.ceil((d.y - bottomEdge) / 3));
    if (speed) scrollBy(0, speed);
    const sy = scrollY;
    const dy = Math.max(d.min, Math.min(d.max, d.y - d.y0 + (sy - d.sy0)));
    if (dy !== d.dy || sy !== d.sy || !d.drawn) {
      d.dy = dy;
      d.sy = sy;
      d.drawn = true;
      d.li.style.transform = `translateY(${dy}px) scale(1.02)`;
      const me = d.rows[d.from];
      const center = me.top + dy + me.h / 2;
      let to = 0;
      d.rows.forEach((r, i) => { if (i !== d.from && r.top + r.h / 2 < center) to++; });
      if (to !== d.to) {
        d.to = to;
        d.rows.forEach((r, i) => {
          if (i === d.from) return;
          let shift = 0;
          if (d.from < to && i > d.from && i <= to) shift = -d.slot;
          else if (to < d.from && i >= to && i < d.from) shift = d.slot;
          r.el.style.transform = shift ? `translateY(${shift}px)` : "";
        });
      }
    }
    d.raf = requestAnimationFrame(dragFrame);
  }

  // Suelta (commit = true) o cancela (Escape / pointercancel) el arrastre.
  function endDrag(commit) {
    const d = drag;
    if (!d) return;
    drag = null;
    cancelAnimationFrame(d.raf);
    const { li, grip } = d;
    grip.removeEventListener("pointermove", onDragMove);
    grip.removeEventListener("pointerup", onDragUp);
    grip.removeEventListener("pointercancel", onDragCancel);
    grip.removeEventListener("lostpointercapture", onDragCancel);
    document.removeEventListener("keydown", onDragKey, true);
    try { if (grip.hasPointerCapture(d.id)) grip.releasePointerCapture(d.id); } catch {}
    document.body.classList.remove("grabbing");
    const list = $("list");
    if (!li.isConnected) { list.classList.remove("is-dragging"); return; }
    const animate = !reduceMotion.matches && li.animate;
    const moved = commit && d.to !== d.from;
    const before = li.getBoundingClientRect().top;
    // Sin transición: las otras filas ya están visualmente donde quedan tras mover la del arrastre.
    list.classList.remove("is-dragging");
    li.classList.remove("dragging");
    for (const r of d.rows) r.el.style.transform = "";
    if (moved) {
      const others = d.rows.filter((r) => r.el !== li).map((r) => r.el);
      list.insertBefore(li, others[d.to] || null);
      applyDomOrder();
    } else if (animate && !commit) {
      // Cancelado: las demás filas vuelven deslizándose a su lugar.
      d.rows.forEach((r, i) => {
        if (i === d.from) return;
        let shift = 0;
        if (d.from < d.to && i > d.from && i <= d.to) shift = -d.slot;
        else if (d.to < d.from && i >= d.to && i < d.from) shift = d.slot;
        if (shift) r.el.animate([{ transform: `translateY(${shift}px)` }, { transform: "none" }], { duration: 200, easing: "cubic-bezier(.2,.75,.25,1)" });
      });
    }
    // La fila "se asienta" desde donde se soltó hasta su lugar final.
    const delta = before - li.getBoundingClientRect().top;
    if (animate && Math.abs(delta) > 0.5) {
      li.classList.add("settling");
      const anim = li.animate([{ transform: `translateY(${delta}px) scale(1.02)` }, { transform: "none" }],
        { duration: 180, easing: "cubic-bezier(.2,.75,.25,1)" });
      const off = () => li.classList.remove("settling");
      anim.finished.then(off, off);
    }
  }

  // Flechas ↑/↓ con el ⋮⋮ enfocado: mueve el link un lugar entre los visibles. Se mueve la fila
  // vecina (no la enfocada) para que el foco se quede en este ⋮⋮.
  function moveByKey(e, li) {
    if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
    e.preventDefault();
    if (drag || li.classList.contains("leaving")) return;
    const up = e.key === "ArrowUp";
    const other = up ? li.previousElementSibling : li.nextElementSibling;
    if (!other || other.classList.contains("leaving")) return;
    const list = $("list");
    const pair = [li, other];
    const first = pair.map((el) => el.getBoundingClientRect().top);
    if (up) list.insertBefore(other, li.nextSibling);
    else list.insertBefore(other, li);
    if (!reduceMotion.matches && li.animate) {
      pair.forEach((el, i) => {
        const dy = first[i] - el.getBoundingClientRect().top;
        if (dy) el.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 160, easing: "cubic-bezier(.2,.75,.25,1)" });
      });
    }
    applyDomOrder();
    li.scrollIntoView({ block: "nearest" });
  }

  // Un link recién abierto: si se muestran los vistos solo se atenúa; si no, se pliega y desaparece.
  function hideItem(li) {
    if (!li || !li.isConnected) return renderList();
    if (showDone) return li.classList.add("done");
    if (reduceMotion.matches || !li.animate) return setTimeout(renderList, 0); // tras abrir la pestaña
    const cs = getComputedStyle(li);
    li.classList.add("leaving");
    const anim = li.animate([
      { height: `${li.offsetHeight}px`, opacity: 1, marginBottom: cs.marginBottom, paddingTop: cs.paddingTop, paddingBottom: cs.paddingBottom, transform: "none" },
      { height: `${li.offsetHeight}px`, opacity: 0, marginBottom: cs.marginBottom, paddingTop: cs.paddingTop, paddingBottom: cs.paddingBottom, transform: "translateX(24px)", offset: 0.45 },
      { height: "0px", opacity: 0, marginBottom: "0px", paddingTop: "0px", paddingBottom: "0px", borderTopWidth: "0px", borderBottomWidth: "0px", transform: "translateX(24px)" },
    ], { duration: 380, easing: "ease-in", fill: "forwards" });
    // El timer cubre el caso de la pestaña en segundo plano (el usuario está en el link recién abierto).
    const done = () => li.isConnected && renderList();
    anim.finished.then(done, () => {});
    setTimeout(done, 450);
  }

  function renderPauta() {
    renderHeader();
    renderList();
    $("pStatus").textContent = "";
    $("pStatus").classList.remove("err");
  }

  $("copy").addEventListener("click", async () => {
    const txt = items.map((it, i) => `${i + 1}. ${it.title}\n${it.url}`).join("\n\n");
    try { await navigator.clipboard.writeText(txt); status("Lista copiada."); } catch { status("No pude copiar.", true); }
  });

  $("openNext").addEventListener("click", () => {
    const it = items.find((x) => !x.done);
    if (!it) return status("Ya abriste todos.");
    window.open(it.url, "_blank", "noopener");
    markDone(it);
    hideItem($("list").querySelector(`li[data-id="${it.id}"]`));
  });

  $("toggleDone").addEventListener("click", () => {
    showDone = !showDone;
    try { localStorage.setItem("pauta:mostrarVistos", showDone ? "1" : "0"); } catch {}
    renderHeader();
    renderList();
  });

  function resetPauta() {
    if (!current || doneCount() === 0) return;
    if (!confirm("¿Reiniciar la pauta? Vuelven a aparecer todos los links.")) return;
    for (const it of items) it.done = false;
    saveDone();
    renderPauta();
    status("Pauta reiniciada.");
    window.scrollTo(0, 0);
  }
  $("reset").addEventListener("click", resetPauta);
  $("resetEnd").addEventListener("click", resetPauta);

  /* ---------- Historial (vista inicio) ---------- */

  async function loadHistory() {
    let pautas;
    try {
      await saving;
      ({ pautas } = await api("api/pautas"));
    } catch (e) {
      console.warn("No pude cargar el historial:", e);
      return;
    }
    const list = $("historyList");
    list.replaceChildren();
    $("historyEmpty").hidden = pautas.length > 0;
    for (const p of pautas) {
      const row = document.createElement("div");
      row.className = "h-item";
      row.dataset.id = p.id;
      row.innerHTML = `<button class="h-open"><span class="h-date"></span><span class="h-meta"></span><span class="h-prev"></span><span class="h-prog" aria-hidden="true"><span></span></span></button><button class="h-del" title="Borrar" aria-label="Borrar pauta">×</button>`;
      row.querySelector(".h-date").textContent = fecha(p.createdAt);
      const full = p.count > 0 && p.doneCount >= p.count;
      row.querySelector(".h-meta").textContent = full ? `${p.count} links · terminada ✓` : `${p.count} links · ${p.doneCount}/${p.count} vistos`;
      row.querySelector(".h-prog").classList.toggle("full", full);
      row.querySelector(".h-prog > span").style.width = `${p.count ? Math.round((p.doneCount / p.count) * 100) : 0}%`;
      row.querySelector(".h-prev").textContent = p.preview[0] || "";
      row.querySelector(".h-open").addEventListener("click", () => goPauta(p.id));
      row.querySelector(".h-del").addEventListener("click", () => removePauta(p));
      list.appendChild(row);
    }
  }

  async function removePauta(p) {
    if (!confirm(`¿Borrar la pauta del ${fecha(p.createdAt)}?`)) return;
    try {
      await api(`api/pautas/${p.id}`, { method: "DELETE" });
      if (current && current.id === p.id) setPauta(null);
      await loadHistory();
    } catch (e) {
      status(e.message, true);
    }
  }

  /* ---------- Animación "armando": una lista que se reordena ---------- */

  const shuffler = { timer: null };

  const rand = (n) => Math.floor(Math.random() * n);
  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  function setTone(card, tono) {
    card.classList.remove(...TONOS);
    card.classList.add(tono);
  }

  // Barras abstractas: solo color de tono y largo variable, sin texto.
  function buildCards() {
    const box = $("shuffle");
    box.replaceChildren();
    for (let i = 0; i < 5; i++) {
      const card = document.createElement("div");
      card.className = "sc";
      card.style.width = `${40 + rand(55)}%`;
      setTone(card, TONOS[rand(3)]);
      box.appendChild(card);
    }
  }

  // FLIP: mide, reordena el DOM y anima cada tarjeta desde su posición anterior.
  function flip(box, mutate, lifted) {
    const kids = [...box.children];
    const first = new Map(kids.map((k) => [k, k.getBoundingClientRect().top]));
    mutate();
    for (const k of kids) {
      const dy = first.get(k) - k.getBoundingClientRect().top;
      if (!dy) continue;
      const lift = lifted.includes(k);
      const frames = lift
        ? [{ transform: `translateY(${dy}px)` }, { transform: `translateY(${dy / 2}px) scale(1.02)`, offset: 0.5 }, { transform: "none" }]
        : [{ transform: `translateY(${dy}px)` }, { transform: "none" }];
      if (lift) k.classList.add("lift");
      const anim = k.animate(frames, { duration: lift ? 620 : 520, easing: "cubic-bezier(.2,.75,.25,1)" });
      if (lift) anim.finished.then(() => k.classList.remove("lift"), () => k.classList.remove("lift"));
    }
  }

  function shuffleStep() {
    const box = $("shuffle");
    const kids = [...box.children];
    const n = kids.length;
    if (!reduceMotion.matches && n > 2) {
      if (Math.random() < 0.6) {
        // Saca una tarjeta y la mete más arriba o más abajo.
        const i = rand(n);
        let j = rand(n);
        while (Math.abs(j - i) < 2) j = rand(n);
        const card = kids[i];
        flip(box, () => box.insertBefore(card, j > i ? kids[j].nextSibling : kids[j]), [card]);
      } else {
        // Intercambia dos tarjetas.
        const i = rand(n);
        let j = rand(n);
        while (j === i) j = rand(n);
        const a = kids[i], b = kids[j];
        flip(box, () => {
          const nextA = a.nextSibling;
          if (nextA === b) return box.insertBefore(b, a);
          box.insertBefore(a, b);
          box.insertBefore(b, nextA);
        }, [a, b]);
      }
    }
    // A veces una tarjeta "se reclasifica".
    if (Math.random() < 0.4) {
      const card = kids[rand(n)];
      setTone(card, TONOS.filter((t) => !card.classList.contains(t))[rand(2)]);
    }
  }

  function startShuffle() {
    buildCards();
    stopShuffle();
    shuffler.timer = setInterval(shuffleStep, reduceMotion.matches ? 1600 : 1000);
  }

  function stopShuffle() {
    clearInterval(shuffler.timer);
    shuffler.timer = null;
    $("shuffle").getAnimations?.({ subtree: true }).forEach((a) => a.cancel());
  }

  function showArmando(on) {
    $("form").hidden = on;
    $("armando").hidden = !on;
    window.scrollTo(0, 0);
  }

  /* ---------- Armar pauta ---------- */

  $("go").addEventListener("click", async () => {
    if (busy) return;
    const texto = $("texto").value.trim();
    if (!texto) return status("Pega la lista primero.", true);
    busy = true;
    $("go").disabled = true;
    status("");
    const t0 = Date.now();
    const n = (texto.match(/https?:\/\//g) || []).length;
    const tick = () => { $("armandoStatus").textContent = `Armando la pauta de ${n} links… ${Math.round((Date.now() - t0) / 1000)} s (suele tardar ~1 min)`; };
    tick();
    const timer = setInterval(tick, 1000);
    startShuffle();
    showArmando(true);
    try {
      const data = await api("api/ordenar", {
        method: "POST",
        body: JSON.stringify({ texto, criterio: $("criterio").value.trim() }),
      });
      setPauta(data.pauta);
      showArmando(false);
      goPauta(data.pauta.id);
      $("pStatus").textContent = `${items.length} links ordenados en ${((Date.now() - t0) / 1000).toFixed(1)} s`;
    } catch (e) {
      showArmando(false);
      status(e.message, true);
    } finally {
      clearInterval(timer);
      stopShuffle();
      busy = false;
      $("go").disabled = false;
    }
  });

  route();
</script>
</body>
</html>
