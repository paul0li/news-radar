# /etc/nginx/sites-available/news-radar.paul0li.tech
# HTTPS lo agrega certbot: sudo certbot --nginx -d news-radar.paul0li.tech
server {
    listen 80;
    server_name news-radar.paul0li.tech;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s; # claude -p puede tardar
    }
}
